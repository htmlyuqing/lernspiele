<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lernspiele</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #dddbd4;
    --text: #1a1a18;
    --muted: #7a7870;
    --accent: #1D9E75;
    --radius: 14px;
    --radius-sm: 8px;
  }
  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 60px;
    -webkit-text-size-adjust: 100%;
  }
  .container { max-width: 520px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 40px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header p  { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .subject-block { margin-bottom: 32px; }
  .subject-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .game-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
  }
  .game-card:active { box-shadow: 0 0 0 3px rgba(29,158,117,0.15); border-color: var(--accent); }

  .game-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .game-icon.green  { background: #e8f5e0; }
  .game-icon.blue   { background: #e6f1fb; }
  .game-icon.amber  { background: #faeeda; }
  .game-icon.purple { background: #eeedfe; }

  .game-info { flex: 1; min-width: 0; }
  .game-title { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .game-desc  { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .game-arrow { font-size: 18px; color: var(--border); flex-shrink: 0; }

  .coming-soon {
    opacity: 0.45;
    pointer-events: none;
  }
  .badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 99px;
    background: #e8f5e0;
    color: #2d5e08;
    flex-shrink: 0;
  }
  .badge.soon { background: #f5f4f0; color: var(--muted); }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Lernspiele</h1>
    <p>Klicke ein Spiel an, um zu starten</p>
  </header>

  <div class="subject-block">
    <div class="subject-label">Mathematik</div>

    <a href="spiele/quadratzahlen/index.html" class="game-card">
      <div class="game-icon green">&#x1F7E9;</div>
      <div class="game-info">
        <div class="game-title">Quadratzahlen 11&#8211;19</div>
        <div class="game-desc">Multiple Choice, Eingabe, Umkehren</div>
      </div>
      <span class="badge">Neu</span>
      <span class="game-arrow">&#8250;</span>
    </a>

    <a href="#" class="game-card coming-soon">
      <div class="game-icon blue">&#x2716;</div>
      <div class="game-info">
        <div class="game-title">Einmaleins</div>
        <div class="game-desc">Kleines und gro&#223;es 1&#215;1</div>
      </div>
      <span class="badge soon">Bald</span>
      <span class="game-arrow">&#8250;</span>
    </a>

    <a href="#" class="game-card coming-soon">
      <div class="game-icon amber">&#x1F4D0;</div>
      <div class="game-info">
        <div class="game-title">Bruchrechnen</div>
        <div class="game-desc">Addieren, Subtrahieren, K&#252;rzen</div>
      </div>
      <span class="badge soon">Bald</span>
      <span class="game-arrow">&#8250;</span>
    </a>
  </div>

  <div class="subject-block">
    <div class="subject-label">Sprache</div>

    <a href="#" class="game-card coming-soon">
      <div class="game-icon purple">&#x1F4DD;</div>
      <div class="game-info">
        <div class="game-title">Vokabeln</div>
        <div class="game-desc">Englisch &#8211; Deutsch Kartei</div>
      </div>
      <span class="badge soon">Bald</span>
      <span class="game-arrow">&#8250;</span>
    </a>
  </div>

</div>
</body>
</html>
